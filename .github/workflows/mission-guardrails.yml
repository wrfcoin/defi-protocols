name: Mission Guardrails

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  mission-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate mission guardrails
        run: python3 scripts/check_mission_guardrails.py --repo-root .

      - name: Validator unit tests
        run: python3 -m unittest scripts/test_check_mission_guardrails.py
