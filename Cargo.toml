[workspace]
resolver = "2"
members = [
    "crates/defi-common",
    "crates/lending",
    "crates/yield-farming",
    "crates/amm",
    "crates/liquid-staking",
    "crates/twap-oracle",
    "crates/parametric-insurance",
    "crates/weather-derivatives",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wrfcoin/defi-protocols"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
